<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 799" width="840" height="799" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS. h11: colibri 6.5 µs, fasthttp 8.2 µs, Fastify 40.9 µs, h2o 13.4 µs, http.zig 19.2 µs, hyper 8.4 µs, net/http 14.9 µs, nginx 8.0 µs; h11 over TLS: colibri 8.1 µs, fasthttp 8.2 µs, Fastify 69.7 µs, h2o 14.5 µs, hyper 8.4 µs, net/http 15.5 µs, nginx 11.2 µs; h2: colibri 1.5 µs, Fastify 52.8 µs, h2o 6.3 µs, hyper 5.0 µs, net/http 33.1 µs, nginx 9.5 µs; h2 over TLS: colibri 2.2 µs, Fastify 56.6 µs, h2o 7.1 µs, hyper 5.5 µs, net/http 35.1 µs, nginx 6.8 µs; h3: colibri 3.9 µs, axum 11.4 µs, quic-go 45.0 µs.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
