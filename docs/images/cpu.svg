<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 619" width="840" height="619" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h2, h2 over TLS and h3, and ties for it in h11 and h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h2, h2 over TLS and h3, and ties for it in h11 and h11 over TLS. h11: colibri 6.2 µs, h2o 12.6 µs, http.zig 20.9 µs, hyper 7.8 µs, nginx 7.1 µs; h11 over TLS: colibri 7.9 µs, h2o 17.8 µs, hyper 7.9 µs, nginx 12.3 µs; h2: colibri 1.5 µs, h2o 5.3 µs, hyper 5.2 µs, nginx 9.1 µs; h2 over TLS: colibri 2.2 µs, h2o 6.7 µs, hyper 5.6 µs, nginx 6.6 µs; h3: colibri 3.9 µs, quic-go 43.2 µs.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --other:#6b6a64;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="619" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">colibri takes the least CPU time a request in h2, h2 over TLS and h3,</text>
<text class="title" x="24" y="56">and ties for it in h11 and h11 over TLS</text>
<text class="sub" x="24" y="78">The time the server's threads ran, in user space and in the kernel, over the requests of the load. Shorter is better.</text>
<text class="sub" x="24" y="96">Each server runs on a core of its own. From two other cores, wrk sends 16 connections, and h2load 16 of 10 streams each.</text>
<text class="sub" x="24" y="114">One run of bench.yml measured all: run 44446759723, commit 89045d95, Neoverse-N2, Linux 7.0.0-1017-azure.</text>
