<rect width="840" height="821" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3,</text>
<text class="title" x="24" y="56">and ties for it in h11 over TLS</text>
<text class="sub" x="24" y="78">The time the server's threads ran, in user space and in the kernel, over the requests of the load. Shorter is better.</text>
<text class="sub" x="24" y="96">Each server runs on a core of its own. From two other cores, wrk sends 16 connections, and h2load 16 of 10 streams each.</text>
<text class="sub" x="24" y="114">Over h3, axum serves through quinn and the h3 crate.</text>
<text class="sub" x="24" y="132">One run of bench.yml measured all: run 294, commit 3ac8c7bc, Neoverse-N2, Linux 7.0.0-1017-azure.</text>
