<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 799" width="840" height="799" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS. h11: colibri 6.2 µs, fasthttp 8.0 µs, Fastify 38.4 µs, h2o 13.7 µs, http.zig 18.9 µs, hyper 7.8 µs, net/http 14.3 µs, nginx 7.3 µs; h11 over TLS: colibri 7.9 µs, fasthttp 8.1 µs, Fastify 63.3 µs, h2o 14.3 µs, hyper 8.4 µs, net/http 15.2 µs, nginx 11.0 µs; h2: colibri 1.5 µs, Fastify 51.3 µs, h2o 6.2 µs, hyper 4.9 µs, net/http 32.4 µs, nginx 9.4 µs; h2 over TLS: colibri 2.2 µs, Fastify 54.6 µs, h2o 7.1 µs, hyper 5.3 µs, net/http 34.2 µs, nginx 6.7 µs; h3: colibri 3.9 µs, axum 11.3 µs, quic-go 44.0 µs.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
