<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 799" width="840" height="799" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS. h11: colibri 6.7 µs, fasthttp 8.1 µs, Fastify 39.1 µs, h2o 12.9 µs, http.zig 18.9 µs, hyper 8.1 µs, net/http 14.7 µs, nginx 7.7 µs; h11 over TLS: colibri 8.1 µs, fasthttp 8.1 µs, Fastify 65.8 µs, h2o 14.5 µs, hyper 8.3 µs, net/http 15.1 µs, nginx 11.8 µs; h2: colibri 1.5 µs, Fastify 50.5 µs, h2o 6.4 µs, hyper 5.0 µs, net/http 32.3 µs, nginx 9.5 µs; h2 over TLS: colibri 2.1 µs, Fastify 54.4 µs, h2o 7.1 µs, hyper 5.2 µs, net/http 34.0 µs, nginx 6.9 µs; h3: colibri 3.9 µs, axum 10.9 µs, quic-go 43.1 µs.</desc>
<style>
