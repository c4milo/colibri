<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 799" width="840" height="799" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS. h11: colibri 6.5 µs, fasthttp 8.2 µs, Fastify 38.0 µs, h2o 13.7 µs, http.zig 18.4 µs, hyper 8.1 µs, net/http 14.4 µs, nginx 7.6 µs; h11 over TLS: colibri 8.2 µs, fasthttp 8.0 µs, Fastify 66.3 µs, h2o 14.3 µs, hyper 8.4 µs, net/http 15.2 µs, nginx 10.7 µs; h2: colibri 1.5 µs, Fastify 52.7 µs, h2o 6.2 µs, hyper 4.9 µs, net/http 33.4 µs, nginx 9.5 µs; h2 over TLS: colibri 2.1 µs, Fastify 55.8 µs, h2o 7.3 µs, hyper 5.4 µs, net/http 33.7 µs, nginx 7.0 µs; h3: colibri 3.9 µs, axum 11.2 µs, quic-go 44.2 µs.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
