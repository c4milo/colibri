<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 799" width="840" height="799" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3; another server is better in h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3; another server is better in h11 over TLS. h11: colibri 6.6 µs, fasthttp 8.2 µs, Fastify 40.1 µs, h2o 14.0 µs, http.zig 19.8 µs, hyper 8.2 µs, net/http 15.7 µs, nginx 7.7 µs; h11 over TLS: colibri 8.8 µs, fasthttp 7.7 µs, Fastify 64.4 µs, h2o 16.8 µs, hyper 7.7 µs, net/http 16.1 µs, nginx 14.7 µs; h2: colibri 1.5 µs, Fastify 50.9 µs, h2o 6.4 µs, hyper 4.9 µs, net/http 33.4 µs, nginx 8.6 µs; h2 over TLS: colibri 2.3 µs, Fastify 54.0 µs, h2o 7.3 µs, hyper 5.5 µs, net/http 33.2 µs, nginx 7.5 µs; h3: colibri 4.0 µs, axum 11.5 µs, quic-go 43.2 µs.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
