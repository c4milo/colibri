<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 821" width="840" height="821" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS. h11: colibri 6.8 µs, fasthttp 8.8 µs, Fastify 36.8 µs, h2o 14.0 µs, http.zig 19.4 µs, hyper 8.7 µs, net/http 15.1 µs, nginx 8.2 µs; h11 over TLS: colibri 8.4 µs, fasthttp 8.5 µs, Fastify 63.4 µs, h2o 14.9 µs, hyper 8.7 µs, net/http 15.9 µs, nginx 11.0 µs; h2: colibri 1.5 µs, Fastify 51.8 µs, h2o 6.2 µs, hyper 4.9 µs, net/http 33.1 µs, nginx 9.7 µs; h2 over TLS: colibri 2.2 µs, Fastify 54.9 µs, h2o 7.0 µs, hyper 5.4 µs, net/http 33.4 µs, nginx 6.9 µs; h3: colibri 3.9 µs, axum 11.3 µs, quic-go 44.2 µs.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --other:#6b6a64;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
.better { fill: #1a7f37; } .worse { fill: #cf222e; }
@media (prefers-color-scheme: dark) { .better { fill: #3fb950; } .worse { fill: #f85149; } }
.was { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 2 2; }
