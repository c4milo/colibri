<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 754" width="840" height="754" role="img" aria-labelledby="t d">
<title id="t">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS</title>
<desc id="d">colibri takes the least CPU time a request in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS. h11: colibri 6.6 µs, fasthttp 8.1 µs, Fastify 36.8 µs, h2o 13.3 µs, http.zig 19.2 µs, hyper 7.9 µs, net/http 15.0 µs, nginx 7.4 µs; h11 over TLS: colibri 8.3 µs, fasthttp 8.3 µs, Fastify 63.1 µs, h2o 16.0 µs, hyper 8.5 µs, net/http 15.8 µs, nginx 11.7 µs; h2: colibri 1.5 µs, Fastify 51.5 µs, h2o 6.2 µs, hyper 5.0 µs, net/http 32.6 µs, nginx 9.4 µs; h2 over TLS: colibri 2.2 µs, Fastify 55.0 µs, h2o 7.0 µs, hyper 5.3 µs, net/http 33.8 µs, nginx 6.8 µs; h3: colibri 3.9 µs, quic-go 43.8 µs.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
