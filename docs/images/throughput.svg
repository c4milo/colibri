<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 507" width="840" height="507" role="img" aria-labelledby="t d">
<title id="t">colibri answers the most requests a second in h2, and ties for it in h11, h2 over TLS and h3</title>
<desc id="d">colibri answers the most requests a second in h2, and ties for it in h11, h2 over TLS and h3. h11: axum 84,203 req/s, net/http + chi 66,650 req/s, colibri 82,777 req/s, Fastify 19,948 req/s, http.zig 69,992 req/s; h2: axum 70,321 req/s, net/http + chi 32,933 req/s, colibri 84,712 req/s, Fastify 15,807 req/s; h2 over TLS: axum 79,970 req/s, net/http + chi 32,811 req/s, colibri 76,826 req/s, Fastify 12,970 req/s; h3: axum on quinn 51,585 req/s, quic-go + chi 30,480 req/s, colibri 54,897 req/s.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --other:#6b6a64;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="507" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">colibri answers the most requests a second in h2, and ties for it in h11,</text>
<text class="title" x="24" y="56">h2 over TLS and h3</text>
<text class="sub" x="24" y="78">The most requests a second each server answered, all with 200, at any rate oha offered over the GitHub API's routes.</text>
<text class="sub" x="24" y="96">Each server runs on a core of its own, and oha on two others. Over h2 with TLS, oha's own limit is near. Longer is better.</text>
<text class="sub" x="24" y="114">One run of bench.yml measured all: run 44445591237, commit 89045d95, Neoverse-N2, Linux 7.0.0-1017-azure.</text>
<text class="panel" x="24" y="162">h11</text>
<line x1="128.0" y1="172" x2="128.0" y2="306" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="128.0" y="321" text-anchor="middle">0</text>
