<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 817" width="840" height="817" role="img" aria-labelledby="t d">
<title id="t">colibri serves the most requests a second on one core in each load</title>
<desc id="d">colibri serves the most requests a second on one core in each load. h11: nginx 123,423 req/s, h2o 75,280 req/s, hyper 117,914 req/s, http.zig 57,736 req/s, net/http 61,928 req/s, fasthttp 117,147 req/s, Fastify 27,226 req/s, colibri 148,680 req/s; h11 over TLS: nginx 77,671 req/s, h2o 58,893 req/s, hyper 107,363 req/s, net/http 58,841 req/s, fasthttp 110,873 req/s, Fastify 16,634 req/s, colibri 124,181 req/s; h2: nginx 105,390 req/s, h2o 183,070 req/s, hyper 217,040 req/s, net/http 33,165 req/s, Fastify 29,400 req/s, colibri 1,046,070 req/s; h2 over TLS: nginx 159,742 req/s, h2o 175,690 req/s, hyper 235,860 req/s, net/http 32,665 req/s, Fastify 28,530 req/s, colibri 960,670 req/s; h3: quic-go 29,046 req/s, axum 129,040 req/s, colibri 277,952 req/s.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --other:#6b6a64;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
.better { fill: #1a7f37; } .worse { fill: #cf222e; }
@media (prefers-color-scheme: dark) { .better { fill: #3fb950; } .worse { fill: #f85149; } }
.was { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 2 2; }
</style>
<rect width="840" height="817" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">colibri serves the most requests a second on one core in each load</text>
<text class="sub" x="24" y="56">h2load, or wrk for h11, loads each server at full speed for 10 s from two other cores, with 32 connections</text>
<text class="sub" x="24" y="74">and 100 streams on each h2 or h3 connection. Each server runs on a core of its own. Longer is better. A bar</text>
<text class="sub" x="24" y="92">marked ≥ is a server whose core was not full, so the load tool was the limit.</text>
<text class="sub" x="24" y="110">Over h3, axum serves through quinn and the h3 crate.</text>
<text class="sub" x="24" y="128">One run of bench.yml measured all: run 295, commit 3ac8c7bc, Neoverse-N2, Linux 7.0.0-1017-azure.</text>
