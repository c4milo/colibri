<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 817" width="840" height="817" role="img" aria-labelledby="t d">
<title id="t">colibri serves the most requests a second on one core in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS</title>
<desc id="d">colibri serves the most requests a second on one core in h11, h2, h2 over TLS and h3, and ties for it in h11 over TLS. h11: nginx 130,978 req/s, h2o 77,614 req/s, hyper 119,750 req/s, http.zig 62,451 req/s, net/http 65,345 req/s, fasthttp 121,547 req/s, Fastify 27,100 req/s, colibri 151,454 req/s; h11 over TLS: nginx 61,995 req/s, h2o 66,802 req/s, hyper 114,905 req/s, net/http 61,256 req/s, fasthttp 117,097 req/s, Fastify 16,980 req/s, colibri 125,703 req/s; h2: nginx 116,286 req/s, h2o 186,150 req/s, hyper 226,100 req/s, net/http 35,432 req/s, Fastify 35,700 req/s, colibri 1,065,450 req/s; h2 over TLS: nginx 119,467 req/s, h2o 177,420 req/s, hyper 239,040 req/s, net/http 34,698 req/s, Fastify 33,580 req/s, colibri 968,000 req/s; h3: quic-go 31,284 req/s, axum 133,660 req/s, colibri 286,800 req/s.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --other:#a3a29c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --other:#6b6a64;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
.better { fill: #1a7f37; } .worse { fill: #cf222e; }
@media (prefers-color-scheme: dark) { .better { fill: #3fb950; } .worse { fill: #f85149; } }
.was { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 2 2; }
</style>
<rect width="840" height="817" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">colibri serves the most requests a second on one core in h11, h2, h2 over TLS and h3,</text>
<text class="title" x="24" y="56">and ties for it in h11 over TLS</text>
<text class="sub" x="24" y="78">h2load, or wrk for h11, loads each server at full speed for 10 s from two other cores, with 32 connections</text>
<text class="sub" x="24" y="96">and 100 streams on each h2 or h3 connection. Each server runs on a core of its own. Longer is better. A bar</text>
<text class="sub" x="24" y="114">marked ≥ is a server whose core was not full, so the load tool was the limit.</text>
<text class="sub" x="24" y="132">Over h3, axum serves through quinn and the h3 crate.</text>
<text class="sub" x="24" y="150">One run of bench.yml measured all: run 291, commit 2ab43623, Neoverse-N2, Linux 7.0.0-1017-azure.</text>
