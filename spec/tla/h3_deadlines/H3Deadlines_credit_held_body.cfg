\* expect: violated
\* A finding, kept until it is ruled on: a body's clock runs while the client has spent its credit
\* and the credit that would let it send waits in colibri behind the congestion window, which the
\* client's next acknowledgment frees.
\* Two request streams whose heads take two units and whose content takes three, small windows
\* and a congestion window of two packets. No deadline passes.
SPECIFICATION Spec
CONSTANTS
    N = 2
    HeadUnits = 2
    Content = 3
    ResponseUnits = 2
    StreamWindow = 2
    ConnectionWindow = 4
    CongestionWindow = 2
    Fire = FALSE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = FALSE
    UncountedAsked = TRUE
    PauseForCredit = FALSE
INVARIANTS BodyWaitsOnPeer
CHECK_DEADLOCK FALSE
