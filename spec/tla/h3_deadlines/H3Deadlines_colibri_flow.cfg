\* expect: holds
\* colibri's rules: the send clock runs only while a packet of colibri's is on its way or
\* unacknowledged.
\* Two request streams whose heads take two units and whose content takes three, small windows
\* and a congestion window of two packets. No deadline passes.
SPECIFICATION Spec
CONSTANTS
    N = 2
    HeadUnits = 2
    Content = 3
    ResponseUnits = 2
    StreamWindow = 2
    ConnectionWindow = 4
    CongestionWindow = 2
    Fire = FALSE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = FALSE
    UncountedAsked = TRUE
    PauseForCredit = FALSE
INVARIANTS TypeOK SendWaitsOnPeer
CHECK_DEADLOCK FALSE
