\* expect: holds
\* colibri's rules, ending the connection on their own.
\* Two request streams whose heads take two units, no content, and windows that never bind.
SPECIFICATION Spec
CONSTANTS
    N = 2
    HeadUnits = 2
    Content = 0
    ResponseUnits = 1
    StreamWindow = 10
    ConnectionWindow = 20
    CongestionWindow = 12
    Fire = TRUE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = TRUE
    UncountedAsked = TRUE
    PauseForCredit = TRUE
INVARIANTS TypeOK NothingUnsaid GoawayBeforeClose RejectedUnprocessed OnlyChosenCounted
CHECK_DEADLOCK FALSE
