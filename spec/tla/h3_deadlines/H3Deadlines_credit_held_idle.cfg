\* expect: violated
\* Clocks that run while colibri holds credit, as they did before they waited for it:
\* the idle clock runs while the connection credit the client's next request needs waits
\* in colibri behind the congestion window.
\* Three request streams of a head and two units of content, small windows and a congestion
\* window of one packet. No deadline passes.
SPECIFICATION Spec
CONSTANTS
    N = 3
    HeadUnits = 1
    Content = 2
    ResponseUnits = 2
    StreamWindow = 2
    ConnectionWindow = 3
    CongestionWindow = 1
    Fire = FALSE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = TRUE
    UncountedAsked = TRUE
    PauseForCredit = FALSE
INVARIANTS IdleWaitsOnPeer
CHECK_DEADLOCK FALSE
