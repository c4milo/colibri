\* expect: violated
\* A finding, kept until it is fixed: a head's clock runs while the connection credit
\* the rest of the head needs waits in colibri behind the congestion window.
\* Two request streams whose heads take two units and whose content takes three, small windows
\* and a congestion window of two packets. No deadline passes.
SPECIFICATION Spec
