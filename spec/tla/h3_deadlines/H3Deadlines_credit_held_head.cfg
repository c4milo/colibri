    N = 2
    HeadUnits = 2
    Content = 3
    ResponseUnits = 2
    StreamWindow = 2
    ConnectionWindow = 4
    CongestionWindow = 2
    Fire = FALSE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = TRUE
    UncountedAsked = TRUE
    PauseForCredit = FALSE
INVARIANTS HeadWaitsOnPeer
CHECK_DEADLOCK FALSE
