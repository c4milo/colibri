\* expect: violated
\* A finding, kept until it is ruled on: colibri closes once the client acknowledged the GOAWAY,
\* while the rejection of a request whose head it had not read is still owed or on its way, and
\* the client never learns that it may send that request again.
\* Two request streams whose heads take two units, no content, and windows that never bind.
SPECIFICATION Spec
CONSTANTS
    N = 2
    HeadUnits = 2
    Content = 0
    ResponseUnits = 1
    StreamWindow = 10
    ConnectionWindow = 20
    CongestionWindow = 12
    Fire = TRUE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = FALSE
    UncountedAsked = TRUE
    PauseForCredit = FALSE
INVARIANTS NothingUnsaid
CHECK_DEADLOCK FALSE
