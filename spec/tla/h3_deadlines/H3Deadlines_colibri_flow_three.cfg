\* expect: holds
\* colibri's rules on three streams, where a client's next request can wait for credit.
\* Three request streams of a head and two units of content, small windows and a congestion
\* window of one packet. No deadline passes.
SPECIFICATION Spec
CONSTANTS
    N = 3
    HeadUnits = 1
    Content = 2
    ResponseUnits = 2
    StreamWindow = 2
    ConnectionWindow = 3
    CongestionWindow = 1
    Fire = FALSE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = TRUE
    UncountedAsked = TRUE
    PauseForCredit = TRUE
INVARIANTS TypeOK HeadWaitsOnPeer BodyWaitsOnPeer IdleWaitsOnPeer SendWaitsOnPeer
CHECK_DEADLOCK FALSE
