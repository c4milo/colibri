\* expect: holds
\* The head, body and idle clocks waiting while colibri holds credit it has not sent: every
\* clock runs only while the client holds colibri up.
\* Two request streams whose heads take two units and whose content takes three, small windows
\* and a congestion window of two packets. No deadline passes.
SPECIFICATION Spec
CONSTANTS
    N = 2
    HeadUnits = 2
    Content = 3
    ResponseUnits = 2
    StreamWindow = 2
    ConnectionWindow = 4
    CongestionWindow = 2
    Fire = FALSE
    ClientCancels = FALSE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = TRUE
    UncountedAsked = TRUE
    PauseForCredit = TRUE
INVARIANTS TypeOK HeadWaitsOnPeer BodyWaitsOnPeer IdleWaitsOnPeer SendWaitsOnPeer
CHECK_DEADLOCK FALSE
