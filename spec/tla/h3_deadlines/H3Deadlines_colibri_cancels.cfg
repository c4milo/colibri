\* expect: holds
\* colibri's rules, with bodies and the client's cancels.
\* One request stream with a head of two units, one unit of content, a response of two units,
\* and client cancels, with windows that never bind.
SPECIFICATION Spec
CONSTANTS
    N = 1
    HeadUnits = 2
    Content = 1
    ResponseUnits = 2
    StreamWindow = 10
    ConnectionWindow = 20
    CongestionWindow = 12
    Fire = TRUE
    ClientCancels = TRUE
    RejectUnread = TRUE
    CloseAfterAck = TRUE
    CloseAfterResets = FALSE
    UncountedAsked = TRUE
    PauseForCredit = FALSE
INVARIANTS TypeOK GoawayBeforeClose RejectedUnprocessed OnlyChosenCounted
CHECK_DEADLOCK FALSE
