\* expect: violated
\* A server that answers before its SETTINGS, as colibri did until e3126a9: the response goes ahead
\* of the SETTINGS (RFC 9113 §3.4).
SPECIFICATION Spec
CONSTANTS
    N = 2
    Content = 1
    Interims = 1
    MaxGoaways = 0
    Resets = FALSE
    SendInState = TRUE
    DataAfterHead = TRUE
    OneFinalHead = TRUE
    DiscardAfterReset = TRUE
    IgnoreAboveGoaway = TRUE
    NoStreamAfterGoaway = TRUE
    PrefaceFirst = FALSE
INVARIANTS TypeOK NothingBeforePreface
CHECK_DEADLOCK FALSE
