\* expect: holds
\* Safety alone. With one slot each, both endpoints can stop reading while both channels are
\* full, which ChannelMax, far below a transport's buffers, allows: resets_finish checks liveness.
SPECIFICATION Spec
CONSTANTS
    Client = client
    Server = server
    Nobody = nobody
    ChannelMax = 2
    Max = 4
    Streams = {1, 3}
    Body = 2
    InitialWindow = 2
    Threshold = 1
    Changer = nobody
    NewInits = {}
    ChangesMax = 0
    HonourNegative = TRUE
    DropOnEnd = TRUE
    QueueMax = 1
    Resetter = server
    ResetOnRecord = TRUE
    DropOnReset = TRUE
    ChargeAfterReset = TRUE
    FrameMax = 1
    Chunk = 1
    Floor = 0
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    ServerTimeout = FALSE
    OwedFirst = {}
    Weighted = FALSE
INVARIANTS TypeOK NoForbiddenFrame NoFlowError QueueBounded
CHECK_DEADLOCK FALSE
