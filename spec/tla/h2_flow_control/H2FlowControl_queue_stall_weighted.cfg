\* expect: violated
\* The stall of queue_stall over a channel that counts DATA units, where a reply takes one unit
\* and a DATA frame its units and one for its header: in a free order an endpoint fills the
\* room a read frees with DATA, and its replies wait.
SPECIFICATION Spec
CONSTANTS
    Client = client
    Server = server
    Nobody = nobody
    ChannelMax = 3
    Max = 4
    Streams = {1, 3}
    Body = 2
    InitialWindow = 2
    Threshold = 1
    Changer = nobody
    NewInits = {}
    ChangesMax = 0
    HonourNegative = TRUE
    DropOnEnd = TRUE
    QueueMax = 1
    Resetter = nobody
    ResetOnRecord = TRUE
    DropOnReset = TRUE
    ChargeAfterReset = TRUE
    FrameMax = 2
    Chunk = 2
    Floor = 0
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    ServerTimeout = FALSE
    OwedFirst = {}
    Weighted = TRUE
INVARIANTS TypeOK NoForbiddenFrame NoFlowError QueueBounded ChannelBounded
PROPERTIES Finishes
CHECK_DEADLOCK FALSE
