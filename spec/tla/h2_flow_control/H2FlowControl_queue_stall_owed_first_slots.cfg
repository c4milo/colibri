\* expect: violated
\* queue_stall with both endpoints writing what they owe first, over a channel of two frames in
\* which a reply takes as much room as a DATA frame: the replies fill it, so the order does not
\* help, and the transport must hold more than they need (decision 39 as amended).
SPECIFICATION Spec
CONSTANTS
    Client = client
    Server = server
    Nobody = nobody
    ChannelMax = 2
    Max = 4
    Streams = {1, 3}
    Body = 2
    InitialWindow = 2
    Threshold = 1
    Changer = nobody
    NewInits = {}
    ChangesMax = 0
    HonourNegative = TRUE
    DropOnEnd = TRUE
    QueueMax = 1
    Resetter = nobody
    ResetOnRecord = TRUE
    DropOnReset = TRUE
    ChargeAfterReset = TRUE
    FrameMax = 1
    Chunk = 1
    Floor = 0
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    ServerTimeout = FALSE
    OwedFirst = {client, server}
    Weighted = FALSE
INVARIANTS TypeOK NoForbiddenFrame NoFlowError QueueBounded
PROPERTIES Finishes
CHECK_DEADLOCK FALSE
