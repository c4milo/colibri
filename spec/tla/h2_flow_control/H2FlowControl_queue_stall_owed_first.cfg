\* expect: holds
\* queue_stall_weighted with both endpoints writing what they owe first, as colibri's client and
\* server do (decision 39 as amended).
SPECIFICATION Spec
CONSTANTS
    Client = client
    Server = server
    Nobody = nobody
    ChannelMax = 3
    Max = 4
    Streams = {1, 3}
    Body = 2
    InitialWindow = 2
    Threshold = 1
    Changer = nobody
    NewInits = {}
    ChangesMax = 0
    HonourNegative = TRUE
    DropOnEnd = TRUE
    QueueMax = 1
    Resetter = nobody
    ResetOnRecord = TRUE
    DropOnReset = TRUE
    ChargeAfterReset = TRUE
    FrameMax = 2
    Chunk = 2
    Floor = 0
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    ServerTimeout = FALSE
    OwedFirst = {client, server}
    Weighted = TRUE
INVARIANTS TypeOK NoForbiddenFrame NoFlowError QueueBounded ChannelBounded
PROPERTIES Finishes
CHECK_DEADLOCK FALSE
