    Server = server
    Nobody = nobody
    ChannelMax = 3
    Max = 4
    Streams = {1, 3}
    Body = 3
    InitialWindow = 3
    Threshold = 3
    Changer = nobody
    NewInits = {}
    ChangesMax = 0
    HonourNegative = TRUE
    DropOnEnd = TRUE
    QueueMax = 8
    Resetter = nobody
    ResetOnRecord = TRUE
    DropOnReset = TRUE
    ChargeAfterReset = TRUE
    FrameMax = 3
    Chunk = 2
    Floor = 2
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
