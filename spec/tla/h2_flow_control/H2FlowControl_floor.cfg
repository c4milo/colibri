\* expect: holds
\* colibri's floor, the peer's window above it, and a peer that gives credit back only
\* for its whole window: no increment is below the floor, so it never applies.
SPECIFICATION Spec
CONSTANTS
    Client = client
    Server = server
    Nobody = nobody
    ChannelMax = 4
    Max = 4
    Streams = {1}
    Body = 7
    InitialWindow = 3
    Threshold = 3
    Changer = nobody
    NewInits = {}
    ChangesMax = 0
    HonourNegative = TRUE
    DropOnEnd = TRUE
    QueueMax = 8
    Resetter = nobody
    ResetOnRecord = TRUE
    DropOnReset = TRUE
    ChargeAfterReset = TRUE
    FrameMax = 3
    Chunk = 2
    Floor = 2
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    ServerTimeout = FALSE
    OwedFirst = {}
    Weighted = FALSE
INVARIANTS TypeOK NoForbiddenFrame NoFlowError
PROPERTIES Finishes
CHECK_DEADLOCK FALSE
