\* expect: violated
\* module: ClientExchanges
\* EndWhenIdle off: the caller cancels the only exchange during the QUIC handshake, which then
\* fails, and the attempt stays open. Fresh must find that the next exchange could end refused
\* with no connection opened (https://github.com/c4milo/colibri/issues/100).
SPECIFICATION FairSpec
CONSTANTS
    N = 1
    Opens = 1
    MovesMax = 1
    QuicPolicy = "first"
    TcpAllowed = FALSE
    HandshakeFails = {"quic", "tcp"}
    Breaks = {"quic", "tcp"}
    Goaways = {"quic", "tcp"}
    GoawaysMax = 2
    Refusals = {"quic", "tcp"}
    Resets = {"quic", "tcp"}
    Idempotent = {1}
    TcpSlots = {"tcp"}
    TcpCapacity = 2
    TcpDrops = FALSE
    ReleaseOnFail = TRUE
    CloseWhenDrained = TRUE
    ReportWhenReleased = TRUE
    CancelReleases = TRUE
    SentFailsClosed = TRUE
    MoveRefused = TRUE
    RetireStale = TRUE
    KeepAlive = TRUE
    TakeAtHandshake = TRUE
    TcpWhenAllowed = TRUE
    ResendIdempotent = TRUE
    OneBudget = TRUE
    TakeWithinRoom = TRUE
    TryOncePerWait = TRUE
    EndWhenIdle = FALSE
INVARIANTS TypeOK Safe
PROPERTIES Fresh
CHECK_DEADLOCK FALSE
