\* expect: holds
\* A pool of two TCP slots whose connections each hold one exchange, as h11's do (decision 125):
\* a second slot opens while the first is busy, may fail its handshake and open again in a later
\* wait, every exchange still ends, and the pool closes once shut down.
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    Opens = 2
    MovesMax = 1
    QuicPolicy = "never"
    TcpAllowed = TRUE
    HandshakeFails = {"tcp2"}
    Breaks = {"tcp"}
    Goaways = {}
    GoawaysMax = 0
    Refusals = {}
    Resets = {}
    Idempotent = {1}
    TcpSlots = {"tcp", "tcp2"}
    TcpCapacity = 1
    TcpDrops = TRUE
    ReleaseOnFail = TRUE
    CloseWhenDrained = TRUE
    ReportWhenReleased = TRUE
    CancelReleases = TRUE
    SentFailsClosed = TRUE
    MoveRefused = TRUE
    RetireStale = TRUE
    KeepAlive = TRUE
    TakeAtHandshake = TRUE
    TcpWhenAllowed = TRUE
    ResendIdempotent = TRUE
    OneBudget = TRUE
    TakeWithinRoom = TRUE
    TryOncePerWait = TRUE
INVARIANTS TypeOK Safe Bounded
PROPERTIES Ends Closes
CHECK_DEADLOCK FALSE
