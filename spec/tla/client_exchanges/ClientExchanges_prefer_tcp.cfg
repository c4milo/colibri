\* expect: holds
\* Design §8 step 43: a client that opens TCP first (decision 117 as amended), and QUIC only once
\* TCP failed. Every transport may fail, refuse, reset and send a GOAWAY.
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    Opens = 1
    MovesMax = 1
    QuicPolicy = "first"
    Prefer = "tcp"
    TcpAllowed = TRUE
    HandshakeFails = {"quic", "tcp"}
    Breaks = {"quic", "tcp"}
    Goaways = {"quic", "tcp"}
    GoawaysMax = 2
    Refusals = {"quic", "tcp"}
    Resets = {"quic", "tcp"}
    Idempotent = {1}
    Streamed = {}
    TcpSlots = {"tcp"}
    TcpCapacity = 2
    TcpDrops = FALSE
    ReleaseOnFail = TRUE
    CloseWhenDrained = TRUE
    ReportWhenReleased = TRUE
    CancelReleases = TRUE
    SentFailsClosed = TRUE
    MoveRefused = TRUE
    RetireStale = TRUE
    KeepAlive = TRUE
    TakeAtHandshake = TRUE
    TcpWhenAllowed = TRUE
    ResendIdempotent = TRUE
    OneBudget = TRUE
    TakeWithinRoom = TRUE
    TryOncePerWait = TRUE
    EndWhenIdle = TRUE
    FinishWhenReleased = TRUE
    CreditAfterRelease = TRUE
    ResendBeforeTaken = TRUE
INVARIANTS TypeOK Safe
PROPERTIES Ends Closes
CHECK_DEADLOCK FALSE
