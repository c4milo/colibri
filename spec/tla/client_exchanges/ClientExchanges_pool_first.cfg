\* expect: holds
\* A pool that tries QUIC first and holds two TCP slots of one exchange each (decision 125): TCP
\* grows only while it carries the exchanges, and QUIC never opens beside an open TCP connection.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Opens = 1
    MovesMax = 1
    QuicPolicy = "first"
    TcpAllowed = TRUE
    HandshakeFails = {"quic", "tcp2"}
    Breaks = {"quic", "tcp"}
    Goaways = {}
    GoawaysMax = 0
    Refusals = {}
    Resets = {}
    Idempotent = {1}
    TcpSlots = {"tcp", "tcp2"}
    TcpCapacity = 1
    TcpDrops = TRUE
    ReleaseOnFail = TRUE
    CloseWhenDrained = TRUE
    ReportWhenReleased = TRUE
    CancelReleases = TRUE
    SentFailsClosed = TRUE
    MoveRefused = TRUE
    RetireStale = TRUE
    KeepAlive = TRUE
    TakeAtHandshake = TRUE
    TcpWhenAllowed = TRUE
    ResendIdempotent = TRUE
    OneBudget = TRUE
    TakeWithinRoom = TRUE
    TryOncePerWait = TRUE
INVARIANTS TypeOK Safe Bounded
CHECK_DEADLOCK FALSE
