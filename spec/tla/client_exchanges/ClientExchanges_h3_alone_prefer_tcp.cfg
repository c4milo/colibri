\* expect: holds
\* Design §8 step 43: a client that speaks h3 alone opens QUIC first, though it prefers TCP, and
\* never opens TCP (RFC 9114 §3.1).
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    Opens = 1
    MovesMax = 1
    QuicPolicy = "first"
    Prefer = "tcp"
    TcpAllowed = FALSE
    HandshakeFails = {"quic", "tcp"}
    Breaks = {"quic", "tcp"}
    Goaways = {"quic", "tcp"}
    GoawaysMax = 2
    Refusals = {"quic", "tcp"}
    Resets = {"quic", "tcp"}
    Idempotent = {1}
    Streamed = {}
    TcpSlots = {"tcp"}
    TcpCapacity = 2
    TcpDrops = FALSE
    ReleaseOnFail = TRUE
    CloseWhenDrained = TRUE
    ReportWhenReleased = TRUE
    CancelReleases = TRUE
    SentFailsClosed = TRUE
    MoveRefused = TRUE
    RetireStale = TRUE
    KeepAlive = TRUE
    TakeAtHandshake = TRUE
    TcpWhenAllowed = TRUE
    ResendIdempotent = TRUE
    OneBudget = TRUE
    TakeWithinRoom = TRUE
    TryOncePerWait = TRUE
    EndWhenIdle = TRUE
    FinishWhenReleased = TRUE
    CreditAfterRelease = TRUE
    ResendBeforeTaken = TRUE
INVARIANTS TypeOK Safe NoTcp
PROPERTIES Ends Closes Fresh
CHECK_DEADLOCK FALSE
