\* expect: holds
\* Design §8 step 43: a pool that opens TCP first and holds two TCP slots of one exchange each
\* (decision 125). QUIC opens once a TCP slot failed, and never beside an open TCP connection.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Opens = 1
    MovesMax = 1
    QuicPolicy = "first"
    Prefer = "tcp"
    TcpAllowed = TRUE
    HandshakeFails = {"quic", "tcp"}
    Breaks = {"quic", "tcp"}
    Goaways = {}
    GoawaysMax = 0
    Refusals = {}
    Resets = {}
    Idempotent = {1}
    Streamed = {}
    TcpSlots = {"tcp", "tcp2"}
    TcpCapacity = 1
    TcpDrops = TRUE
    ReleaseOnFail = TRUE
    CloseWhenDrained = TRUE
    ReportWhenReleased = TRUE
    CancelReleases = TRUE
    SentFailsClosed = TRUE
    MoveRefused = TRUE
    RetireStale = TRUE
    KeepAlive = TRUE
    TakeAtHandshake = TRUE
    TcpWhenAllowed = TRUE
    ResendIdempotent = TRUE
    OneBudget = TRUE
    TakeWithinRoom = TRUE
    TryOncePerWait = TRUE
    EndWhenIdle = TRUE
    FinishWhenReleased = TRUE
    CreditAfterRelease = TRUE
    ResendBeforeTaken = TRUE
INVARIANTS TypeOK Safe Bounded
CHECK_DEADLOCK FALSE
