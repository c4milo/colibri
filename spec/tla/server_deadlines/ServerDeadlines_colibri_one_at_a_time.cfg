\* expect: holds
\* colibri's rules, two streams one after the other, with larger buffers.
\* Small stand-ins: a frame is one octet of header and its DATA, and SETTINGS and WINDOW_UPDATE
\* carry no payload octets.
SPECIFICATION Spec
CONSTANTS
    StreamCount = 2
    RequestBody = 2
    ResponseBody = 2
    ProduceStep = 1
    ConnectionWindow = 3
    LocalWindow = 2
    LocalThreshold = 1
    PeerWindow = 2
    PeerThreshold = 1
    Floor = 2
    FrameMax = 2
    HeaderLen = 1
    SettingsLen = 0
    UpdateLen = 0
    PrefaceLen = 1
    RequestHeadLen = 0
    ResponseHeadLen = 0
    OutputLen = 6
    ChannelLen = 5
    Pipelining = FALSE
    MaximalUploads = FALSE
    IdleAfterOutput = TRUE
    SettingsPause = TRUE
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    BodyPauseForUpdate = TRUE
INVARIANTS TypeOK IdleWaitsOnPeer SettingsWaitsOnPeer BodyWaitsOnPeer SendWaitsOnPeer
CHECK_DEADLOCK FALSE
