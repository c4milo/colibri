\* expect: holds
\* colibri's rules, with a peer that gives credit back only for its whole window, as
\* floor_any_update has it.
\* Small stand-ins: a frame is one octet of header and its DATA, and SETTINGS and WINDOW_UPDATE
\* carry no payload octets.
SPECIFICATION Spec
CONSTANTS
    StreamCount = 1
    RequestBody = 2
    ResponseBody = 4
    ProduceStep = 1
    ConnectionWindow = 3
    LocalWindow = 2
    LocalThreshold = 1
    PeerWindow = 3
    PeerThreshold = 3
    Floor = 2
    FrameMax = 2
    HeaderLen = 1
    SettingsLen = 0
    UpdateLen = 0
    PrefaceLen = 1
    RequestHeadLen = 0
    ResponseHeadLen = 0
    OutputLen = 5
    ChannelLen = 4
    Pipelining = TRUE
    MaximalUploads = FALSE
    IdleAfterOutput = TRUE
    SettingsPause = TRUE
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    BodyPauseForUpdate = TRUE
INVARIANTS TypeOK SendWaitsOnPeer
CHECK_DEADLOCK FALSE
