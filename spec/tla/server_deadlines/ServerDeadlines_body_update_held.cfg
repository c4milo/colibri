\* expect: violated
\* A body's deadline running while the client's window is spent and colibri's output holds the
\* WINDOW_UPDATE that reopens it, before decision 110 was amended
\* (https://github.com/c4milo/colibri/issues/89).
\* Small stand-ins: a frame is one octet of header and its DATA, and SETTINGS and WINDOW_UPDATE
\* carry no payload octets.
SPECIFICATION Spec
CONSTANTS
    StreamCount = 1
    RequestBody = 3
    ResponseBody = 2
    ProduceStep = 1
    ConnectionWindow = 2
    LocalWindow = 2
    LocalThreshold = 1
    PeerWindow = 2
    PeerThreshold = 1
    Floor = 2
    FrameMax = 2
    HeaderLen = 1
    SettingsLen = 0
    UpdateLen = 0
    PrefaceLen = 1
    RequestHeadLen = 0
    ResponseHeadLen = 0
    OutputLen = 5
    ChannelLen = 4
    Pipelining = TRUE
    MaximalUploads = FALSE
    IdleAfterOutput = TRUE
    SettingsPause = TRUE
    FloorOnlyAbove = TRUE
    FloorAfterSmall = TRUE
    BodyPauseForUpdate = FALSE
INVARIANTS BodyWaitsOnPeer
CHECK_DEADLOCK FALSE
