    PeerThreshold = 1
    Floor = 2
    OutputMax = 3
    ChannelMax = 2
    Pipelining = TRUE
    IdleAfterOutput = TRUE
    SettingsPause = TRUE
    FloorOnlyAbove = TRUE
INVARIANTS TypeOK IdleWaitsOnPeer SettingsWaitsOnPeer SendWaitsOnPeer
CHECK_DEADLOCK FALSE
