\* expect: violated
\* The floor applied whatever the peer's window, before decision 110 was amended: a stream whose
\* peer advertised a window below the floor waits for credit the peer never has.
\* Small stand-ins: a frame is one octet of header and its DATA, and SETTINGS and WINDOW_UPDATE
\* carry no payload octets.
SPECIFICATION Spec
CONSTANTS
    StreamCount = 2
    RequestBody = 2
    ResponseBody = 2
    ProduceStep = 1
    ConnectionWindow = 3
    LocalWindow = 2
    LocalThreshold = 1
    PeerWindow = 1
    PeerThreshold = 1
    Floor = 2
    FrameMax = 2
    HeaderLen = 1
    SettingsLen = 0
    UpdateLen = 0
    PrefaceLen = 1
    RequestHeadLen = 0
    ResponseHeadLen = 0
    OutputLen = 5
    ChannelLen = 4
    Pipelining = TRUE
    MaximalUploads = FALSE
    IdleAfterOutput = TRUE
    SettingsPause = TRUE
    FloorOnlyAbove = FALSE
    FloorAfterSmall = FALSE
    BodyPauseForUpdate = TRUE
INVARIANTS SendWaitsOnPeer
CHECK_DEADLOCK FALSE
