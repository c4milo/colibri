# h2o over TLS for tools/h2_interop.sh: the identity tools/h2_interop/tls_identity.go minted, which
# the run mounts at /identity. ALPN selects h2 (RFC 9113 §3.2).
listen:
  port: 8080
  ssl:
    certificate-file: /identity/colibri.chain.pem
    key-file: /identity/colibri.key.pem
    # The certificate names no OCSP responder, and the image carries no openssl to ask one.
    ocsp-update-interval: 0
hosts:
  default:
    paths:
      /:
        file.dir: /www
