# The judge of design §8 step 13a (decision 33 as amended on 2026-09-30): bench/run.sh on the
# ubuntu-24.04-arm runner, a Neoverse N2, started by a person and never by a push (decision 47 as
# amended). With `base`, each job builds that commit beside the change and measures the two in
# turns, so that a ratio compares two builds on one machine. The two jobs run on two runners, and
# a change stays only when it wins past the noise in both. With `competitors`, nginx's mainline,
# h2o built from its master, hyper, http.zig, Go's net/http, fasthttp and Fastify answer the same
# requests in the same job (design §8 steps 13c, 13g, 13o and 13p), and with `h11` four h11
# inputs join the four h2 ones, which wrk sends. With `h3`,
# the UDP server answers the load over h3 too, and with `competitors` and `h3`, so does quic-go's
# server from its image (design §8 step 13d). With `latency`, bench/run.sh --latency measures the
# throughput and the latency of servers that route, colibri's and chi's, axum's, http.zig's and
# Fastify's, at fixed rates under oha, over h11, h2, h2 over TLS and h3 (design §8 step 13f). With
# `network`, bench/run.sh --latency --network measures colibri, chi and axum over h2 over TLS and
# h3 on a loopback path that tc netem gives delay and loss (design §8 step 13i). With `waits`,
# bench/run.sh --latency --waits records how colibri's and axum's servers run and sleep on their
# core under the latency load, with perf sched, and counts each server with perf stat (design §8
# step 13j). With `bulk`, bench/run.sh --latency --bulk measures downloads of one file at a
# bottleneck that tc netem holds (design §8 step 13k). With
# `profile`, perf record samples colibri's server and its call stacks under each input, and the
# artifact holds the folded stacks (design §8 step 13h). The work is bench/run.sh, which a person on
# Linux with perf runs for the same answer; this file only installs what it needs.
name: Bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: "A commit, branch or tag to measure in turns with this one; empty for none"
        type: string
        default: ""
      rounds:
        description: "The rounds each build is counted in, after the warm-up round"
        type: string
        default: "5"
      competitors:
        description: "Measure nginx, h2o, hyper, http.zig, Go's net/http, fasthttp and Fastify too, and quic-go with h3, in turns with colibri's servers"
        type: boolean
        default: false
      h11:
        description: "Measure the four h11 inputs too"
        type: boolean
        default: false
      h3:
        description: "Measure the UDP server over h3 too, under h2load built with HTTP/3"
        type: boolean
        default: false
      latency:
        description: "Measure the latency of servers that route at fixed rates under oha, in place of the other inputs"
        type: boolean
        default: false
      network:
        description: "Measure the latency of h2 over TLS and h3 on paths with delay and loss, in place of the other inputs"
        type: boolean
        default: false
      waits:
        description: "Record how colibri's and axum's servers run and sleep under the latency load, in place of the other inputs"
        type: boolean
        default: false
      bulk:
        description: "Measure downloads at a bottleneck over h3 and h2 over TLS, in place of the other inputs"
        type: boolean
        default: false
      profile:
        description: "Sample colibri's server and its call stacks under each input, in place of the counts"
        type: boolean
        default: false
      qlog:
        description: "With bulk, keep each colibri connection's qlog beside the report; its numbers are not published"
        type: boolean
        default: false
permissions:
  contents: read
env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
  # The Zig that builds http.zig alone (design §8 step 13g): its master targets 0.17.
  ZIG_HTTPZ_VERSION: 0.17.1
  # h2o publishes no releases now, so the competitor run builds this commit of its master (design §8
  # step 13p).
  H2O_COMMIT: d3e43fcf00c3e6b17826b95d2d362d646185918a
  # The fingerprint of the key nginx.org signs its packages with.
  NGINX_KEY_FINGERPRINT: 573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62
  ZIG_HTTPZ_SHA256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
jobs:
  bench:
    name: bench/run.sh (arm64 Linux, runner ${{ matrix.job }} of 2)
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2]
    runs-on: ubuntu-24.04-arm
    # The latency inputs ran 60 minutes with h11, h2 and h3, and h2-tls adds about 20. The bulk
    # inputs with colibri-newreno did not end within 120 minutes at 3 rounds (run 42043605974),
    # and took 132 (run 42575264322). Their h3-resume loads add about 7 minutes a round.
    timeout-minutes: 210
    env:
      RUNNER_LABEL: ubuntu-24.04-arm
      BASE: ${{ inputs.base }}
      ROUNDS: ${{ inputs.rounds }}
      COMPETITORS: ${{ inputs.competitors }}
      H11: ${{ inputs.h11 }}
      H3: ${{ inputs.h3 }}
      LATENCY: ${{ inputs.latency }}
      NETWORK: ${{ inputs.network }}
      WAITS: ${{ inputs.waits }}
      BULK: ${{ inputs.bulk }}
      PROFILE: ${{ inputs.profile }}
      # https://github.com/c4milo/colibri/issues/123: bench/run_bulk.sh writes colibri's qlog here.
      BENCH_BULK_QLOG: ${{ inputs.qlog && 'bench-report-qlog' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that `base` names any commit, branch or tag.
          fetch-depth: 0
      # tools/h2_interop/tls_identity.go mints the TLS identity the server presents.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install Zig
        run: |
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig" && tar -xJf zig.tar.xz -C "${HOME}/zig" --strip-components=1
          rm zig.tar.xz
          echo "${HOME}/zig" >>"${GITHUB_PATH}"
      # perf comes in the tools built for the running kernel. bench/run.sh runs it as root, which
      # lets it count the kernel's instructions and read the system call tracepoint, so no kernel
      # setting changes.
      - name: Install h2load, perf and tcpdump
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nghttp2-client wrk tcpdump linux-tools-common "linux-tools-$(uname -r)"
          echo "PERF=/usr/lib/linux-tools/$(uname -r)/perf" >>"${GITHUB_ENV}"
      # nginx's own mainline packages, since Ubuntu's are 1.24 (design §8 step 13p). The package
      # starts its own service, which run.sh never measures and which would hold a core, so the
      # step stops it. bench/run.sh starts nginx from bench/competitors/.
      - name: Install nginx mainline
        if: env.COMPETITORS == 'true'
        run: |
          curl -sSf https://nginx.org/keys/nginx_signing.key | gpg --dearmor >nginx.gpg
          gpg --show-keys --with-colons nginx.gpg | grep -q "^fpr:::::::::${NGINX_KEY_FINGERPRINT}:"
          sudo install -m 644 nginx.gpg /usr/share/keyrings/nginx-archive-keyring.gpg && rm nginx.gpg
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/mainline/ubuntu $(lsb_release -cs) nginx" |
            sudo tee /etc/apt/sources.list.d/nginx.list >/dev/null
          printf 'Package: *\nPin: origin nginx.org\nPin-Priority: 900\n' | sudo tee /etc/apt/preferences.d/99nginx >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
          sudo systemctl stop nginx || true
      # h2o from H2O_COMMIT, with mruby, whose handler bench/competitors/h2o.conf answers with. The
      # build is cached under the commit, so a run rebuilds it only when the commit changes.
      - name: Restore h2o
        if: env.COMPETITORS == 'true'
        id: h2o
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/h2o
          key: h2o-${{ runner.os }}-${{ runner.arch }}-${{ env.H2O_COMMIT }}
      - name: Build h2o
        if: env.COMPETITORS == 'true' && steps.h2o.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends cmake bison ruby libssl-dev zlib1g-dev
          git init -q h2o-source && git -C h2o-source fetch -q --depth 1 https://github.com/h2o/h2o.git "${H2O_COMMIT}"
          git -C h2o-source checkout -q FETCH_HEAD
          cmake -S h2o-source -B h2o-build -DCMAKE_BUILD_TYPE=Release -DWITH_MRUBY=ON -DCMAKE_INSTALL_PREFIX="${HOME}/h2o"
          cmake --build h2o-build -j "$(nproc)" && cmake --install h2o-build
          rm -rf h2o-source h2o-build
      - name: Put h2o on the path
        if: env.COMPETITORS == 'true'
        run: echo "${HOME}/h2o/bin" >>"${GITHUB_PATH}"
      # bench/run.sh builds hyper with cargo, and rustup installs the release that
      # bench/competitors/hyper/rust-toolchain.toml names on the first call. It builds http.zig
      # with Zig 0.17.1, which no other step uses.
      - name: Install Rust and Zig 0.17.1
        if: env.COMPETITORS == 'true' || env.LATENCY == 'true' || env.NETWORK == 'true' || env.BULK == 'true'
        run: |
          command -v rustup >/dev/null ||
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "${HOME}/.cargo/bin" >>"${GITHUB_PATH}"
          curl -sSfL -o zig-httpz.tar.xz "https://ziglang.org/download/${ZIG_HTTPZ_VERSION}/zig-aarch64-linux-${ZIG_HTTPZ_VERSION}.tar.xz"
          echo "${ZIG_HTTPZ_SHA256}  zig-httpz.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig-httpz" && tar -xJf zig-httpz.tar.xz -C "${HOME}/zig-httpz" --strip-components=1
          rm zig-httpz.tar.xz
          echo "BENCH_ZIG_HTTPZ=${HOME}/zig-httpz/zig" >>"${GITHUB_ENV}"
      # Fastify, a server of the latency inputs and a competitor (design §8 step 13p), on Node's
      # latest LTS release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.LATENCY == 'true' || env.COMPETITORS == 'true'
        with:
          node-version: 26
      # Ubuntu's h2load has no HTTP/3, so the h3 inputs run the one tools/h3load/Dockerfile builds
      # from pinned release tags.
      - name: Build h2load with HTTP/3
        if: env.H3 == 'true'
        run: docker build -q -t colibri-h3load:latest tools/h3load
      # The caches of ci.yml's job `zig build test (arm64 Linux)`, under its keys: this job restores
      # them and saves none.
      - name: Restore the Zig caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-pkg
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-
      # Zig 0.16 keeps a project's packages in zig-pkg beside its build.zig.zon, so the base shares
      # the checkout's and fetches only those its own build.zig.zon adds.
      - name: Check the base out
        if: env.BASE != ''
        run: |
          commit="$(git rev-parse --verify "${BASE}^{commit}" 2>/dev/null || git rev-parse --verify "origin/${BASE}^{commit}")"
          git worktree add --detach base "${commit}"
          ln -s "${GITHUB_WORKSPACE}/zig-pkg" base/zig-pkg
      - name: Measure
        run: |
          arguments=(--rounds "${ROUNDS}")
          if [ -n "${BASE}" ]; then arguments+=(--base base); fi
          if [ "${COMPETITORS}" = true ]; then arguments+=(--competitors); fi
          if [ "${H11}" = true ]; then arguments+=(--h11); fi
          if [ "${H3}" = true ]; then arguments+=(--h3); fi
          # --latency runs bench/run_latency.sh in place of the other inputs.
          if [ "${LATENCY}" = true ] || [ "${NETWORK}" = true ] || [ "${WAITS}" = true ] || [ "${BULK}" = true ]; then
            arguments+=(--latency)
          fi
          if [ "${NETWORK}" = true ]; then arguments+=(--network); fi
          if [ "${WAITS}" = true ]; then arguments+=(--waits); fi
          if [ "${BULK}" = true ]; then arguments+=(--bulk); fi
          if [ "${PROFILE}" = true ]; then arguments+=(--profile); fi
          bench/run.sh "${arguments[@]}" bench-report.md
      - name: Publish the report
        if: always()
        run: if [ -f bench-report.md ]; then cat bench-report.md >>"${GITHUB_STEP_SUMMARY}"; fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report-${{ matrix.job }}
          # With `profile`, the folded stacks of each input go beside the report, and with `qlog`
          # colibri's qlog files.
          path: |
            bench-report.md
            bench-report-profile/
            bench-report-qlog/
          if-no-files-found: ignore
          retention-days: 90
