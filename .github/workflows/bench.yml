# The judge of design §8 step 13a (decision 33 as amended on 2026-09-30): bench/run.sh on the
# ubuntu-24.04-arm runner, a Neoverse N2, started by a person and never by a push (decision 47 as
# amended). With `base`, each job builds that commit beside the change and measures the two in
# turns, so that a ratio compares two builds on one machine. The two jobs run on two runners, and
# a change stays only when it wins past the noise in both. With `competitors`, nginx and h2o from
# Ubuntu's packages, hyper and http.zig answer the same requests in the same job (design §8 steps
# 13c and 13g), and with `h11` four h11 inputs join the four h2 ones, which wrk sends. With `h3`,
# the UDP server answers the load over h3 too, and with `competitors` and `h3`, so does quic-go's
# server from its image (design §8 step 13d). With `latency`, bench/run.sh --latency measures the
# throughput and the latency of servers that route, colibri's and chi's, axum's, http.zig's and
# Fastify's, at fixed rates under oha, over h11, h2, h2 over TLS and h3 (design §8 step 13f). With
# `network`, bench/run.sh --latency --network measures colibri, chi and axum over h2 over TLS and
# h3 on a loopback path that tc netem gives delay and loss (design §8 step 13i). With `waits`,
# bench/run.sh --latency --waits records how colibri's and axum's servers run and sleep on their
# core under the latency load, with perf sched (design §8 step 13j). With `bulk`, bench/run.sh
# --latency --bulk measures downloads of one file at a bottleneck that tc netem holds (design §8
# step 13k). With
# `profile`, perf record samples colibri's server and its call stacks under each input, and the
# artifact holds the folded stacks (design §8 step 13h). The work is bench/run.sh, which a person on
# Linux with perf runs for the same answer; this file only installs what it needs.
name: bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: "A commit, branch or tag to measure in turns with this one; empty for none"
        type: string
        default: ""
      rounds:
        description: "The rounds each build is counted in, after the warm-up round"
        type: string
        default: "5"
      competitors:
        description: "Measure nginx, h2o, hyper and http.zig too, and quic-go with h3, in turns with colibri's servers"
        type: boolean
        default: false
      h11:
        description: "Measure the four h11 inputs too"
        type: boolean
        default: false
      h3:
        description: "Measure the UDP server over h3 too, under h2load built with HTTP/3"
        type: boolean
        default: false
      latency:
        description: "Measure the latency of servers that route at fixed rates under oha, in place of the other inputs"
        type: boolean
        default: false
      network:
        description: "Measure the latency of h2 over TLS and h3 on paths with delay and loss, in place of the other inputs"
        type: boolean
        default: false
      waits:
        description: "Record how colibri's and axum's servers run and sleep under the latency load, in place of the other inputs"
        type: boolean
        default: false
      bulk:
        description: "Measure downloads at a bottleneck over h3 and h2 over TLS, in place of the other inputs"
        type: boolean
        default: false
      profile:
        description: "Sample colibri's server and its call stacks under each input, in place of the counts"
        type: boolean
        default: false
permissions:
  contents: read
env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
  # The Zig that builds http.zig alone (design §8 step 13g): its master targets 0.17.0.
  ZIG_HTTPZ_VERSION: 0.17.0
  ZIG_HTTPZ_SHA256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
jobs:
  bench:
    name: bench (job ${{ matrix.job }})
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2]
    runs-on: ubuntu-24.04-arm
    # The latency inputs ran 60 minutes with h11, h2 and h3, and h2-tls adds about 20.
    timeout-minutes: 120
    env:
      RUNNER_LABEL: ubuntu-24.04-arm
      BASE: ${{ inputs.base }}
      ROUNDS: ${{ inputs.rounds }}
      COMPETITORS: ${{ inputs.competitors }}
      H11: ${{ inputs.h11 }}
      H3: ${{ inputs.h3 }}
      LATENCY: ${{ inputs.latency }}
      NETWORK: ${{ inputs.network }}
      WAITS: ${{ inputs.waits }}
      BULK: ${{ inputs.bulk }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so that `base` names any commit, branch or tag.
          fetch-depth: 0
      # tools/h2_interop/tls_identity.go mints the TLS identity the server presents.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - name: Install Zig
        run: |
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig" && tar -xJf zig.tar.xz -C "${HOME}/zig" --strip-components=1
          rm zig.tar.xz
          echo "${HOME}/zig" >>"${GITHUB_PATH}"
      # perf comes in the tools built for the running kernel. bench/run.sh runs it as root, which
      # lets it count the kernel's instructions and read the system call tracepoint, so no kernel
      # setting changes.
      - name: Install h2load, perf and tcpdump
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nghttp2-client wrk tcpdump linux-tools-common "linux-tools-$(uname -r)"
          echo "PERF=/usr/lib/linux-tools/$(uname -r)/perf" >>"${GITHUB_ENV}"
      # Each package starts its own service, which run.sh never measures and which would hold a
      # core, so the step stops both. bench/run.sh starts each from bench/competitors/.
      - name: Install nginx and h2o
        if: env.COMPETITORS == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends nginx h2o
          sudo systemctl stop nginx h2o || true
      # bench/run.sh builds hyper with cargo, and rustup installs the release that
      # bench/competitors/hyper/rust-toolchain.toml names on the first call. It builds http.zig
      # with Zig 0.17.0, which no other step uses.
      - name: Install Rust and Zig 0.17.0
        if: env.COMPETITORS == 'true' || env.LATENCY == 'true' || env.NETWORK == 'true' || env.BULK == 'true'
        run: |
          command -v rustup >/dev/null ||
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "${HOME}/.cargo/bin" >>"${GITHUB_PATH}"
          curl -sSfL -o zig-httpz.tar.xz "https://ziglang.org/download/${ZIG_HTTPZ_VERSION}/zig-aarch64-linux-${ZIG_HTTPZ_VERSION}.tar.xz"
          echo "${ZIG_HTTPZ_SHA256}  zig-httpz.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig-httpz" && tar -xJf zig-httpz.tar.xz -C "${HOME}/zig-httpz" --strip-components=1
          rm zig-httpz.tar.xz
          echo "BENCH_ZIG_HTTPZ=${HOME}/zig-httpz/zig" >>"${GITHUB_ENV}"
      # Fastify, a server of the latency inputs, needs Node 20 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.LATENCY == 'true'
        with:
          node-version: 24
      # Ubuntu's h2load has no HTTP/3, so the h3 inputs run the one tools/h3load/Dockerfile builds
      # from pinned release tags.
      - name: Build h2load with HTTP/3
        if: env.H3 == 'true'
        run: docker build -q -t colibri-h3load:latest tools/h3load
      # The arm64 job's caches in main.yml, under its keys: this job restores them and saves none.
      - name: Restore the Zig caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-pkg
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-
      # Zig 0.16 keeps a project's packages in zig-pkg beside its build.zig.zon, so the base shares
      # the checkout's and fetches only those its own build.zig.zon adds.
      - name: Check the base out
        if: env.BASE != ''
        run: |
          commit="$(git rev-parse --verify "${BASE}^{commit}" 2>/dev/null || git rev-parse --verify "origin/${BASE}^{commit}")"
          git worktree add --detach base "${commit}"
          ln -s "${GITHUB_WORKSPACE}/zig-pkg" base/zig-pkg
      - name: Measure
        run: |
          arguments=(--rounds "${ROUNDS}")
          if [ -n "${BASE}" ]; then arguments+=(--base base); fi
          if [ "${COMPETITORS}" = true ]; then arguments+=(--competitors); fi
          if [ "${H11}" = true ]; then arguments+=(--h11); fi
          if [ "${H3}" = true ]; then arguments+=(--h3); fi
          # --latency runs bench/run_latency.sh in place of the other inputs.
          if [ "${LATENCY}" = true ] || [ "${NETWORK}" = true ] || [ "${WAITS}" = true ] || [ "${BULK}" = true ]; then
            arguments+=(--latency)
          fi
          if [ "${NETWORK}" = true ]; then arguments+=(--network); fi
          if [ "${WAITS}" = true ]; then arguments+=(--waits); fi
          if [ "${BULK}" = true ]; then arguments+=(--bulk); fi
          if [ "${PROFILE}" = true ]; then arguments+=(--profile); fi
          bench/run.sh "${arguments[@]}" bench-report.md
      - name: Publish the report
        if: always()
        run: if [ -f bench-report.md ]; then cat bench-report.md >>"${GITHUB_STEP_SUMMARY}"; fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-report-${{ matrix.job }}
          # With `profile`, the folded stacks of each input go beside the report.
          path: |
            bench-report.md
            bench-report-profile/
          if-no-files-found: ignore
          retention-days: 90
