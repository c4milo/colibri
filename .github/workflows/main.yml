# Every check of this repository, on each push to main, with a report (docs/decisions.md entry
# 46). The work is tools/ci.sh, which a person can run by hand for the same answer; this file only
# installs what that script needs, each download pinned by checksum or commit.
name: main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main
  cancel-in-progress: false
env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  H2SPEC_VERSION: 2.6.0
  H2SPEC_SHA256: 157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - name: Install Zig
        run: |
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig" && tar -xJf zig.tar.xz -C "${HOME}/zig" --strip-components=1
          echo "${HOME}/zig" >>"${GITHUB_PATH}"
          rm zig.tar.xz
      - name: Install h2spec
        run: |
          curl -sSfL -o h2spec.tar.gz "https://github.com/summerwind/h2spec/releases/download/v${H2SPEC_VERSION}/h2spec_linux_amd64.tar.gz"
          echo "${H2SPEC_SHA256}  h2spec.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/bin" && tar -xzf h2spec.tar.gz -C "${HOME}/bin" h2spec
          echo "${HOME}/bin" >>"${GITHUB_PATH}"
          rm h2spec.tar.gz
      - name: Install h2load
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nghttp2-client
      - name: Run every check
        run: tools/ci.sh ci-report.md
      - name: Publish the report
        if: always()
        run: cat ci-report.md >>"${GITHUB_STEP_SUMMARY}"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-${{ github.sha }}
          path: ci-report.md
          retention-days: 90
