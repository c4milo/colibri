# axum, on hyper and a one-thread tokio runtime, a server of colibri's request benchmark (design §8
# step 13f). bench/run.sh --latency builds it with `cargo build --release --locked`, so Cargo.lock
# pins every crate.
[package]
name = "colibri-bench-axum"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "=0.8.6", default-features = false, features = ["http1", "http2", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
# h3 for the latency inputs (design §8 step 13f): quinn and the h3 crate, with rustls on ring.
bytes = "1"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tower = { version = "0.5", features = ["util"] }
# h2 over TLS for the latency inputs: hyper's connection builder over tokio-rustls.
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
