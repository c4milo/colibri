# h2o, one of the h2 servers colibri's is measured against (design §8 step 13c), as
# `bench/run.sh --competitors` starts it: one thread, on the core run.sh pins it to, answering
# every request with the answer of colibri's test-only server from memory, which in h2o 2.2 takes
# its mruby handler. run.sh writes @PORT@, @SSL@, @CHAIN@, @KEY@, @SCRATCH@ and @USER@ before it
# starts h2o. h2o started by root runs as the `user` it names, and nobody else may write the
# scratch directory, so run.sh names the user that started the run.
user: @USER@
num-threads: 1
pid-file: @SCRATCH@/h2o.pid
error-log: @SCRATCH@/h2o.error.log
listen: {host: 127.0.0.1, port: @PORT@@SSL@}
hosts:
  default:
    paths:
      /:
        mruby.handler: |
          Proc.new do |env|
            [200, {"content-type" => "text/plain; charset=utf-8", "content-length" => "8"}, ["colibri\n"]]
          end
