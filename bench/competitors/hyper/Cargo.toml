# hyper, the Rust server colibri's is measured against over h11 and h2 (design §8 step 13g).
# bench/run.sh --competitors builds it with `cargo build --release --locked`, so Cargo.lock pins
# every crate. rustls's default provider, aws-lc-rs, does the TLS work, as it does for most hyper
# servers deployed with rustls.
[package]
name = "colibri-bench-hyper"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt", "net"] }
tokio-rustls = "0.26"
