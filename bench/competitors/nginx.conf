# nginx, one of the h2 servers colibri's is measured against (design §8 step 13c), as
# `bench/run.sh --competitors` starts it: one process with one worker, on the core run.sh pins it
# to, answering every request with the answer of colibri's test-only server from memory. run.sh
# writes @PORT@, @SSL@, @CHAIN@, @KEY@ and @SCRATCH@ before it starts nginx.
daemon off;
master_process off;
worker_processes 1;
pid @SCRATCH@/nginx.pid;
error_log @SCRATCH@/nginx.error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    # nginx closes a connection after 1,000 requests by default, and an h2-many connection carries
    # 1,250.
    keepalive_requests 1000000;
    client_body_temp_path @SCRATCH@/nginx-client-body;
    proxy_temp_path @SCRATCH@/nginx-proxy;
    fastcgi_temp_path @SCRATCH@/nginx-fastcgi;
    uwsgi_temp_path @SCRATCH@/nginx-uwsgi;
    scgi_temp_path @SCRATCH@/nginx-scgi;

    server {
        listen 127.0.0.1:@PORT@ @SSL@http2;
        ssl_certificate @CHAIN@;
        ssl_certificate_key @KEY@;

        location / {
            default_type "text/plain; charset=utf-8";
            return 200 "colibri\n";
        }
    }
}
